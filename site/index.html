    <script>
      // Apply the saved theme and text size before first paint so users do
      // not see a flash of the defaults. Defaults: Studio bright, standard size.
      try {
        var t = localStorage.getItem("sda-theme");
        document.documentElement.dataset.theme =
          ["studio", "dark", "light", "console", "pulse", "ppie"].indexOf(t) >= 0 ? t : "studio";
        var s = localStorage.getItem("sda-textsize");
        if (s === "large" || s === "workshop")
          document.documentElement.dataset.textsize = s;
      } catch (e) { /* storage unavailable: keep the defaults */ }
    </script>
